name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "patch-1" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK r21e
        run: |
          export ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.2

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib gcc-multilib libgl1-mesa-dev libglu1-mesa-dev
          mkdir -p ~/haxelib && haxelib setup ~/haxelib
          if [ -f "setup/unix.sh" ]; then
            chmod +x setup/unix.sh
            ./setup/unix.sh
          elif [ -f "setup/setup-unix.sh" ]; then
            chmod +x setup/setup-unix.sh
            ./setup/setup-unix.sh
          elif [ -f "hmm.json" ]; then
            haxelib install hmm
            haxelib run hmm install
          else
            ls -la setup/
          fi

      - name: Build Android APK
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime build android -final

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-1.0.4-Android
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
